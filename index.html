<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dare to ask Ray</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app">
      <section class="chat">
        <header class="bar">
          <div class="brand">
            <span class="dot" id="dot" data-state="idle"></span>
            <span class="name">Dare to ask Ray</span>
          </div>
          <div class="meta">
            <button class="icon" id="voice" type="button" aria-label="Mute Ray's voice" aria-pressed="false" title="Mute Ray's voice">
              <svg class="when-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" /><path d="M15.5 9a4.2 4.2 0 0 1 0 6" /><path d="M18 6.5a7.8 7.8 0 0 1 0 11" /></svg>
              <svg class="when-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" /><path d="M16 9.5l5 5" /><path d="M21 9.5l-5 5" /></svg>
            </button>
            <button class="icon" id="mute" type="button" aria-label="Mute your microphone" aria-pressed="false" title="Mute your microphone">
              <svg class="when-on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" /><path d="M12 18v2.5" /></svg>
              <svg class="when-off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3" /><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" /><path d="M12 18v2.5" /><path d="M4 4l16 16" /></svg>
            </button>
            <button class="link" id="end" type="button">End</button>
            <span class="status" id="status" aria-live="polite">Not connected</span>
          </div>
        </header>

        <section class="log" id="log" aria-live="polite">
        </section>

        <footer class="dock" id="dock">
          <form class="composer" id="composer" autocomplete="off">
            <input
              id="input"
              type="text"
              placeholder="Got a question about your business?"
              aria-label="Message"
              maxlength="1000"
            />
            <button class="btn primary" id="send" type="submit">Send</button>
          </form>
        </footer>
      </section>

      <section class="stage">
        <canvas id="diamond" aria-hidden="true"></canvas>
        <div class="showcase" id="showcase" hidden>
          <h2 class="panel-title">Explore</h2>
          <div class="featured" id="featured" aria-live="polite"></div>
          <div class="history" id="history" hidden>
            <h2 class="panel-title">Earlier in this chat</h2>
            <div class="history-list" id="historyList"></div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
